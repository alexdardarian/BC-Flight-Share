# SwiftLint configuration for BC Flight Share
# Run: swiftlint lint "BC Flight Share" "BC Flight ShareTests" "BC Flight ShareUITests"
# Auto-fix: swiftlint --fix "BC Flight Share"

included:
  - BC Flight Share
  - BC Flight ShareTests
  - BC Flight ShareUITests

excluded:
  - BC Flight Share/Assets.xcassets

# ── Rule configuration ─────────────────────────────────────────────────────────

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

type_name:
  allowed_symbols: ["_"]   # permits BC_Flight_ShareApp (Xcode-generated entry point)
  min_length: 3
  max_length: 60

identifier_name:
  min_length:
    warning: 2              # allows `db` (idiomatic for Firestore reference)
  excluded:
    - id                    # used in Identifiable conformances

function_parameter_count:
  warning: 6
  error: 8

trailing_comma:
  mandatory_comma: false    # error on trailing commas in arrays/dicts

# ── Opt-in rules ───────────────────────────────────────────────────────────────

opt_in_rules:
  - empty_count             # prefer isEmpty over count == 0
  - closure_spacing         # spaces inside closure braces
  - operator_usage_whitespace
  - collection_alignment
  - contains_over_first_not_nil
  - convenience_type
  - discouraged_object_literal
  - empty_string            # prefer isEmpty over == ""
  - explicit_init
  - fatal_error_message
  - first_where
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_parameters
  - nimble_operator
  - no_extension_access_modifier
  - override_in_extension
  - prefer_self_type_over_type_of_self
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

# ── Disabled rules ─────────────────────────────────────────────────────────────

disabled_rules:
  - todo                    # TODOs are fine during development
  - no_extension_access_modifier  # extensions can declare their own access
  - nimble_operator         # not using Nimble
  - override_in_extension   # not relevant here
  - discouraged_object_literal  # UIColor/UIImage literals are fine
